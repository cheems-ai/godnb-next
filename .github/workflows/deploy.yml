name: Deploy to Vercel (CI/CD)
# ---------------------------------------------------------------------------
# 自动部署流水线 — 不依赖 Vercel GitHub App，纯 CLI + Secrets 驱动。
# 触发：push 到 master/main → Production；PR → Preview
# 凭据：repo Secret VERCEL_TOKEN
#
# 命令行注意事项（历史踩坑）：
#   ❌ --token="$VERCEL_TOKEN"   ← bash 展开后 --token=xxx 会被 CLI 误报 "= in token"
#   ❌ --token=$VERCEL_TOKEN     ← 同上，不加引号也会有 =
#   ✅ --token "$VERCEL_TOKEN"    ← 空格分隔，CLI 正确解析
#   ✅ VERCEL_TOKEN=xxx npx ...   ← 用环境变量（--token 只是多传一次，冗余但安全）
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  deploy:
    name: Vercel Build + Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 用 --token 空格分隔（避免 bash 展开成 --token=value 触发 CLI bug）
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest pull --yes --token "$VERCEL_TOKEN"

      - name: Build & Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          BRANCH=${{ github.ref_name }}
          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            echo "📦 Production deploy from $BRANCH"
            npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "🧪 Preview deploy from $BRANCH"
            npx vercel@latest deploy --yes --token "$VERCEL_TOKEN"
          fi

      - name: Capture deployment URL (always)
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "🔗 Project: https://vercel.com/cheems-ai/godnb-next"
